<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GitHub Issue Read Marker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h1>GitHub Issue Read Marker</h1>
<!-- 文言は popup.js が data-i18n のキーで _locales から差し込む -->
<ol class="ghrc-steps">
  <li data-i18n="popupStep1"></li>
  <li data-i18n="popupStep2"></li>
  <li data-i18n="popupStep3"></li>
</ol>
<div class="ghrc-actions">
  <button type="button" id="compose" data-i18n="menuComposeReply"></button>
  <button type="button" id="clear" class="ghrc-danger" data-i18n="popupClear"></button>
</div>
<p class="ghrc-status" id="status" role="status" aria-live="polite"></p>
<p class="ghrc-foot" data-i18n="popupFoot"></p>
<script src="popup.js"></script>
</body>
</html>
