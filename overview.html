<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Issue Read Marker</title>
<link rel="stylesheet" href="overview.css">
</head>
<body>
<!-- 文言は overview.js が data-i18n のキーで _locales から差し込む -->
<main>
  <header>
    <h1 data-i18n="overviewTitle"></h1>
    <p class="ghrc-muted" data-i18n="overviewIntro"></p>
  </header>

  <div class="ghrc-bar">
    <input type="search" id="filter" data-i18n-placeholder="overviewFilter">
    <span class="ghrc-muted" id="count"></span>
  </div>

  <p class="ghrc-empty ghrc-muted" id="empty" hidden></p>
  <ul class="ghrc-list" id="list"></ul>

  <section class="ghrc-data">
    <h2 data-i18n="overviewData"></h2>
    <p class="ghrc-muted" id="usage"></p>
    <div class="ghrc-actions">
      <button type="button" id="export" data-i18n="overviewExport"></button>
      <button type="button" id="import" data-i18n="overviewImport"></button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button type="button" id="stale" class="ghrc-danger" data-i18n="overviewDeleteStale"></button>
    </div>
    <p class="ghrc-status" id="status" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="overview.js"></script>
</body>
</html>
